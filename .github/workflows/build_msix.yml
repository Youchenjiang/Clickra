name: Build Clickra MSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish Shell DLL
      run: dotnet publish src/ClickraShell/ClickraShell.csproj -c Release -r win-x64 --output ./publish/shell

    - name: Publish CLI App
      run: dotnet publish src/Clickra.CLI/Clickra.csproj -c Release -r win-x64 --output ./publish/cli

    - name: Prepare MSIX Layout
      run: |
        mkdir msix_layout
        mkdir msix_layout/Assets
        copy ./publish/cli/Clickra.exe ./msix_layout/
        copy ./publish/shell/ClickraShell.dll ./msix_layout/
        copy ./packaging/msix/AppxManifest.xml ./msix_layout/
        copy ./packaging/msix/Assets/* ./msix_layout/Assets/

    - name: Create MSIX Package
      shell: pwsh
      run: |
        $makeAppx = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\makeappx.exe"
        & $makeAppx pack /d ./msix_layout /p Clickra.msix /o

    - name: Sign MSIX (Self-Signed for testing)
      shell: pwsh
      run: |
        # 這裡我們在雲端建立一個臨時憑證來簽署，供下載測試使用
        $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=YouchenJiang" -KeyUsage DigitalSignature -FriendlyName "Clickra CI Cert" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
        $signTool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe"
        & $signTool sign /fd SHA256 /a /sha1 $($cert.Thumbprint) Clickra.msix

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Clickra-MSIX
        path: Clickra.msix

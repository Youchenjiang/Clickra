name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs for the same ref to keep the queue short.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Single source of truth for the .NET SDK version used by every job.
# Bump this one value instead of editing each setup-dotnet step.
env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-components:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build Clickra.Core
            kind: build
            project: src/Clickra.Core/Clickra.Core.csproj
          - name: Build Clickra.Fluent
            kind: build
            project: src/Clickra.Fluent/Clickra.Fluent.csproj
          - name: Publish CLI (NativeAOT)
            kind: publish
            project: src/Clickra.CLI/Clickra.csproj
            output: publish/ci/cli
            expected: publish/ci/cli/Clickra.exe
          - name: Publish Shell Extension (NativeAOT)
            kind: publish
            project: src/ClickraShell/ClickraShell.csproj
            output: publish/ci/shell
            expected: publish/ci/shell/ClickraShell.dll
          - name: Publish ClickraLauncher (NativeAOT)
            kind: publish
            project: src/ClickraLauncher/ClickraLauncher.csproj
            output: publish/ci/launcher
            expected: publish/ci/launcher/ClickraLauncher.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build managed project
        if: matrix.kind == 'build'
        run: dotnet build "${{ matrix.project }}" -c Release -warnaserror

      # NativeAOT publish resolves the MSVC toolchain through vswhere.exe;
      # the same helper that scripts/build_msix.ps1 uses keeps that on PATH so
      # the build does not fail with MSB3073 on runners where it is missing.
      - name: Publish NativeAOT project
        if: matrix.kind == 'publish'
        shell: pwsh
        run: |
          . ./scripts/build_common.ps1
          Add-VsInstallerToPath
          dotnet publish "${{ matrix.project }}" -c Release -r win-x64 --self-contained true -o "${{ matrix.output }}" -warnaserror

      - name: Verify expected NativeAOT output
        if: matrix.kind == 'publish'
        shell: pwsh
        run: |
          $expected = "${{ matrix.expected }}"
          if (-not (Test-Path $expected)) {
            throw "Missing expected build output: $expected"
          }
          Write-Host "Expected build output present: $expected"

  build:
    # Keep the historical required-check name while making the expensive
    # component builds independent. This job fails closed if any matrix leg fails.
    name: Build Core / CLI / Shell / Setup
    needs: build-components
    if: always()
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Require every component build
        shell: pwsh
        run: |
          if ("${{ needs.build-components.result }}" -ne "success") {
            throw "One or more component builds failed: ${{ needs.build-components.result }}"
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify product icon assets
        shell: powershell
        run: ./scripts/verify_icon_assets.ps1

      - name: Validate publisher CN consistency across manifests
        shell: pwsh
        run: |
          # All XML/manifest files that declare a publisher must agree on the
          # same CN value.  A mismatch silently breaks MSIX signing because the
          # certificate subject must match the Identity Publisher in the manifest.
          $manifests = @(
            'packaging/msix/AppxManifest.xml',
            'packaging/msix/AppxManifest.Fluent.xml',
            'src/resources/AppxManifest.xml',
            'src/resources/ClickraShell.dll.manifest',
            'src/resources/Clickra.exe.manifest'
          )
          $expected = 'CN=CBF59877-21AD-4BC4-8F91-FE8DA520A138'
          $failures = @()
          foreach ($file in $manifests) {
            if (-not (Test-Path $file)) {
              continue
            }
            $content = Get-Content $file -Raw
            if ($content -match '[Pp]ublisher\s*=\s*"([^"]+)"') {
              $actual = $Matches[1]
              if ($actual -ne $expected) {
                $failures += "$file publisher is '$actual', expected '$expected'"
              }
            }
          }
          if ($failures.Count -gt 0) {
            throw "Publisher CN mismatch detected:`n$($failures -join "`n")"
          }
          Write-Host "All manifests use publisher: $expected"

  deterministic-tests:
    name: Deterministic tests (no fixtures)
    runs-on: windows-latest
    # Intentionally independent from build: this job checks out the same commit
    # and dotnet run builds the self-hosted test runner before executing it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # The suite is an Exe with a self-built TestRunner, not a
      # Microsoft.NET.Test.Sdk project: `dotnet test` would only build it and
      # report success without running a single test. This is the invocation
      # that actually executes the runner (see tests/README.md).
      #
      # The runner prints PASS/FAIL/SKIP per test plus a SUMMARY line with the
      # executed test count, and exits non-zero when any test fails.
      # test_pdfs/ is git-ignored (large PDFs), so on a fresh checkout the
      # fixture-dependent layout tests cannot run: the runner marks them SKIP
      # instead of FAIL, keeping this gate green for the deterministic suite
      # while still telling the truth about what actually executed.
      - name: Run architecture and localization guards
        run: dotnet run --project tests/Clickra.Core.Tests/Clickra.Core.Tests.csproj -c Release --property:TreatWarningsAsErrors=true -- --guards

      - name: Run functional unit tests (fixture SKIP contract)
        run: dotnet run --project tests/Clickra.Core.Tests/Clickra.Core.Tests.csproj -c Release --property:TreatWarningsAsErrors=true -- --functional

  pr-governance-tests:
    name: PR governance script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check PR preflight helpers
        run: python -m unittest discover -s scripts/tests -p 'test_pr_preflight.py' -v
      - name: Check GitHub command denial cases
        run: python -m unittest discover -s scripts/tests -p 'test_gh_guard.py' -v
      - name: Check high-level PR workflow
        run: python -m unittest discover -s scripts/tests -p 'test_pr_tool.py' -v
      - name: Check branch naming policy
        run: python -m unittest discover -s scripts/tests -p 'test_branch_policy.py' -v
      - name: Check provider report retrieval
        run: python -m unittest discover -s scripts/tests -p 'test_pr_reports.py' -v
      - name: Check guarded PR publication and acceptance
        run: |
          python -m unittest discover -s scripts/tests -p 'test_pr_publication.py' -v
          python -m unittest discover -s scripts/tests -p 'test_pr_creation.py' -v
          python -m unittest discover -s scripts/tests -p 'test_pr_verification.py' -v
          python -m unittest discover -s scripts/tests -p 'test_repo_hygiene.py' -v

  store-publishing-tests:
    name: Store publishing unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run Store publishing unit tests
        run: python -m unittest discover -s scripts/tests -p 'test_*store*.py' -v

  fixture-regression-tests:
    # Public, checksum-pinned source PDFs only; private legacy translated
    # baselines are not needed. This job fails closed for translation changes.
    name: Public PDF translation regression
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine translation regression scope
        id: scope
        shell: pwsh
        run: |
          # Compare the full branch against its base, never just HEAD^: a
          # multi-commit push can otherwise miss translation changes.
          $base = if ('${{ github.event_name }}' -eq 'pull_request') { 'origin/${{ github.base_ref }}' } else { 'origin/main' }
          # Exit 1 means supplementary, not an error. GitHub's pwsh wrapper
          # otherwise stops on a nonzero native command before we can inspect it.
          $PSNativeCommandUseErrorActionPreference = $false
          python scripts/pdf_fixture_scope.py --base $base
          $result = $LASTEXITCODE
          if ($result -eq 0) {
            "required=true" >> $env:GITHUB_OUTPUT
          } elseif ($result -eq 1) {
            "required=false" >> $env:GITHUB_OUTPUT
          } else {
            throw "Could not determine PDF regression scope (exit $result)"
          }
          # The GitHub pwsh wrapper exits with the last native exit code even
          # after the supplementary case is handled successfully.
          exit 0

      - name: Setup .NET
        if: steps.scope.outputs.required == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Python
        if: steps.scope.outputs.required == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install PDF parsing dependency
        if: steps.scope.outputs.required == 'true'
        run: python -m pip install pymupdf==1.26.7

      - name: Run public PDF identity translation E2E
        if: steps.scope.outputs.required == 'true'
        run: python tests/PdfRegression/test_public_translation_identity.py

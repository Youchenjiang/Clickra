name: Reconcile Store package with GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag, for example v3.11.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Reconcile verified Store package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          python scripts/enrich_store_release.py `
            --repo "$env:GITHUB_REPOSITORY" `
            --tag "$env:RELEASE_TAG"

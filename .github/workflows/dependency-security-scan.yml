name: Dependency Security Scan

on:
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/dependency-security-scan.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/dependency-security-scan.yml'
  workflow_dispatch:

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nuget-vulnerability:
    name: NuGet Dependency Vulnerability Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'

      - name: Scan for vulnerable packages
        run: |
          echo "## NuGet Dependency Vulnerability Report" > vuln-report.txt
          echo "" >> vuln-report.txt
          VULN_FOUND=false
          for proj in src/Clickra.Core/Clickra.Core.csproj src/Clickra.CLI/Clickra.csproj src/Clickra.Fluent/Clickra.Fluent.csproj; do
            if [ ! -f "$proj" ]; then continue; fi
            echo "Scanning $proj..."
            echo "### $proj" >> vuln-report.txt
            dotnet restore "$proj" -p:EnableWindowsTargeting=true --verbosity quiet 2>&1 || true
            RESULT=$(dotnet list "$proj" package --vulnerable 2>&1) || true
            echo "$RESULT" >> vuln-report.txt
            echo "" >> vuln-report.txt
            if echo "$RESULT" | grep -q "has the following vulnerable packages"; then
              VULN_FOUND=true
            fi
          done
          echo "" >> vuln-report.txt
          if [ "$VULN_FOUND" = true ]; then
            echo "⚠️ **Vulnerable packages detected!** Please update the affected packages." >> vuln-report.txt
            cat vuln-report.txt >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ No known vulnerabilities found." >> vuln-report.txt
            cat vuln-report.txt >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-vulnerability-report
          path: vuln-report.txt
          retention-days: 30

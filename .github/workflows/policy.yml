name: Repository Policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  # Write is needed to auto-assign the PR author when no assignee is set.
  pull-requests: write

jobs:
  conventional-policy:
    name: PR and commit policy
    runs-on: ubuntu-24.04
    steps:
      - name: Validate PR title and commit messages
        uses: actions/github-script@v8
        with:
          script: |
            // KEEP IN SYNC with scripts/hooks/commit-msg — the type/scope
            // allowlists and the subject/body checks below are mirrored in the
            // local commit-msg hook. Edit both files together when adding a
            // type, scope, or commit-message rule.
            const allowedTypes = [
              "feat",
              "fix",
              "refactor",
              "docs",
              "test",
              "chore",
              "style",
              "perf",
              "security",
            ];
            const allowedScopes = [
              "cli",
              "core",
              "shell",
              "msix",
              "docs",
              "ci",
              "deps",
              "store",
              "agent",
            ];
            const typePattern = allowedTypes.join("|");
            const scopePattern = allowedScopes.join("|");
            const pattern = new RegExp(
              `^(${typePattern})(?:\\((${scopePattern})\\))?: [a-z0-9].*$`,
            );

            function validateSubject(subject, label, maxLength = 72) {
              subject = subject.trim();
              const errors = [];
              if (!pattern.test(subject)) {
                errors.push(
                  `${label} must match <type>(<scope>): <description> or <type>: <description> with an allowed type/scope.`,
                );
              }
              if (subject.endsWith(".")) {
                errors.push(`${label} must not end with a period.`);
              }
              if (subject.length > maxLength) {
                errors.push(`${label} must be ${maxLength} characters or less.`);
              }
              const description = subject.replace(
                new RegExp(`^(${typePattern})(?:\\((${scopePattern})\\))?:\\s+`),
                "",
              );
              if (/^(update|misc|stuff|changes|fix bug|bug fix)$/i.test(description)) {
                errors.push(`${label} description is too vague.`);
              }
              return errors;
            }

            // Mirrors scripts/hooks/commit-msg rule #5: the commit body must
            // contain an English numbered list starting with "1. " or "1)".
            // Comment lines and the header line are ignored, exactly like the
            // local hook.
            function validateBody(message, label) {
              const lines = message
                .split("\n")
                .slice(1)
                .filter((line) => !line.startsWith("#"));
              const numberedLine = lines.find((line) =>
                /^\s*1[\.\)]\s+/.test(line),
              );
              if (!numberedLine) {
                return [
                  `${label} body must contain an English numbered list starting with "1. " or "1)"`,
                ];
              }
              // Extract text after the "1. " or "1)" marker and verify it is
              // predominantly ASCII/Latin so the policy truly enforces English.
              const content = numberedLine.replace(/^\s*1[\.\)]\s+/, "");
              const alphaChars = content.replace(/[^a-zA-Z]/g, "");
              if (alphaChars.length === 0) {
                return [];
              }
              const asciiRatio =
                alphaChars.replace(/[^\x00-\x7F]/g, "").length / alphaChars.length;
              if (asciiRatio >= 0.7) {
                return [];
              }
              return [
                `${label} body numbered list content must be predominantly English (ASCII). Got ${Math.round(asciiRatio * 100)}% ASCII letters.`,
              ];
            }

            const failures = [];
            failures.push(...validateSubject(context.payload.pull_request.title, "PR title", 72));

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            for (const commit of commits) {
              const message = commit.commit.message;
              const subject = message.split("\n")[0];
              for (const error of validateSubject(subject, `Commit ${commit.sha.slice(0, 7)}`, 72)) {
                failures.push(`${error}\n  subject: ${subject}`);
              }
              for (const error of validateBody(message, `Commit ${commit.sha.slice(0, 7)}`)) {
                failures.push(`${error}\n  subject: ${subject}`);
              }
            }

            if (failures.length > 0) {
              core.setFailed(failures.join("\n\n"));
            }

      - name: Validate PR metadata (assignee, labels, milestone)
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const failures = [];

            // External provider selection is an explicit architecture decision.
            // Every PR must acknowledge that it either introduces no new named
            // provider or that the user explicitly selected that provider before
            // implementation. This prevents capability requirements from being
            // silently converted into vendor choices.
            const providerAcknowledged = /- \[[xX]\] \*\*External provider\*\*:/.test(
              pr.body || "",
            );
            if (pr.user.type !== "Bot" && !providerAcknowledged) {
              failures.push(
                "PR must check the 'External provider' metadata item. Confirm that no new named " +
                  "provider is introduced, or that the provider was explicitly selected by the user " +
                  "before implementation.",
              );
            }

            // Assignee: self-assign the author so ownership is never "No one".
            // This is a convenience, not a policy gate: a transient GitHub API
            // failure (e.g. 502) must not turn the whole check red, so retry a
            // couple of times and only warn if it still fails.
            if (!pr.assignees || pr.assignees.length === 0) {
              let assigned = false;
              for (let attempt = 1; attempt <= 3 && !assigned; attempt++) {
                try {
                  await github.rest.issues.addAssignees({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    assignees: [pr.user.login],
                  });
                  assigned = true;
                } catch (err) {
                  if (attempt === 3) {
                    core.warning(
                      `Could not auto-assign ${pr.user.login} after 3 attempts: ${err.message}`,
                    );
                  } else {
                    await new Promise((resolve) => setTimeout(resolve, attempt * 2000));
                  }
                }
              }
            }

            // Labels: require at least one, matching the title scope when possible.
            if (!pr.labels || pr.labels.length === 0) {
              failures.push(
                "PR must have at least one label. Pick one that matches the title scope " +
                  "(cli / core / shell / msix / docs / ci / deps / store / agent).",
              );
            }

            // Milestone: required unless this is a release, hotfix, dependency, or
            // docs PR, which target a version milestone or none at all.
            // deps and dependencies are both valid dependency labels; docs PRs
            // (roadmap / agent-rule updates) historically carry no milestone.
            const milestoneExempt = (pr.labels || []).some((label) =>
              /^(release|hotfix|deps|dependencies|docs)$/i.test(label.name),
            );
            if (!pr.milestone && !milestoneExempt) {
              failures.push(
                "PR must be linked to a GitHub Milestone (roadmap phase or target version). " +
                  "Release / hotfix / dependency / docs PRs are exempt. If no milestone exists " +
                  "yet, create one matching the current roadmap phase.",
              );
            }

            if (failures.length > 0) {
              core.setFailed(failures.join("\n\n"));
            }

      - name: Validate localization orphan baseline only shrinks
        uses: actions/github-script@v8
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const orphanFile = files.find(
              (f) => f.filename === "tests/Clickra.Core.Tests/TestSuite.LocalizationOrphans.cs",
            );
            const addedKeys = [];

            if (orphanFile && orphanFile.patch) {
              const lines = orphanFile.patch.split("\n");
              let insideBaseline = false;
              for (const line of lines) {
                if (line.includes("UnconsumedKeyBaseline")) insideBaseline = true;
                if (insideBaseline) {
                  if (line.trim().startsWith("};")) {
                    insideBaseline = false;
                    continue;
                  }
                  if (line.startsWith("+") && !line.startsWith("+++")) {
                    const matches = line.match(/"([A-Za-z0-9_]+)"/g);
                    if (matches) {
                      addedKeys.push(...matches);
                    }
                  }
                }
              }
            }

            if (addedKeys.length > 0) {
              core.setFailed(
                `PR blocked: New unconsumed key(s) added to orphan baseline (${addedKeys.join(", ")}). ` +
                  "New localization keys must have active consumers in src/, and the orphan baseline may only shrink.",
              );
            }

            let currentCount = 33;
            try {
              const contentResp = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: "tests/Clickra.Core.Tests/TestSuite.LocalizationOrphans.cs",
                ref: context.payload.pull_request.head.sha,
              });
              const raw = Buffer.from(contentResp.data.content, "base64").toString("utf8");
              const match = raw.match(/UnconsumedKeyBaseline\s*=\s*\{([\s\S]*?)\};/);
              if (match) {
                const keys = match[1].match(/"([A-Za-z0-9_]+)"/g) || [];
                currentCount = keys.length;
              }
            } catch (err) {
              core.info(`Could not fetch head file content: ${err.message}`);
            }

            await core.summary
              .addHeading("🌐 Localization Orphan Baseline Report")
              .addRaw(`- **Remaining Unconsumed Keys**: \`${currentCount}\`\n`)
              .addRaw(`- **Policy**: \`Monotonically shrinking\` (PRs adding new unconsumed keys are blocked)\n`)
              .write();

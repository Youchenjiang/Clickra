name: Release Clickra MSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.16.2.0)'
        required: false
        type: string
      publish:
        description: 'Publish release to GitHub and Microsoft Store'
        required: false
        type: boolean
        default: false

jobs:
  # NativeAOT dominates release build time. Publish independent binaries on
  # separate hosted runners, then fan them in for deterministic MSIX assembly.
  native-publish:
    name: Publish ${{ matrix.name }} (NativeAOT)
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CLI
            project: src/Clickra.CLI/Clickra.csproj
            artifact: clickra-cli
            output: cli
          - name: Shell Extension
            project: src/ClickraShell/ClickraShell.csproj
            artifact: clickra-shell
            output: shell
          - name: Launcher
            project: src/ClickraLauncher/ClickraLauncher.csproj
            artifact: clickra-launcher
            output: launcher

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish ${{ matrix.name }}
        shell: pwsh
        run: |
          . ./scripts/build_common.ps1
          Add-VsInstallerToPath
          dotnet publish "${{ matrix.project }}" -c Release -r win-x64 --self-contained true -o "publish/${{ matrix.output }}" -warnaserror

      - name: Package Windows CLI archive
        if: matrix.name == 'CLI'
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/${{ matrix.output }}/Clickra.exe" -DestinationPath "publish/clickra-cli-win-x64.zip" -Force

      - name: Upload ${{ matrix.name }} artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: publish/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload Windows CLI archive artifact
        if: matrix.name == 'CLI'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clickra-cli-win-x64.zip
          path: publish/clickra-cli-win-x64.zip
          if-no-files-found: error
          retention-days: 1

  cross-cli-publish:
    name: Publish CLI (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            rid: linux-x64
            binary: Clickra
            archive: clickra-cli-linux-x64.tar.gz
          - name: macOS ARM64
            os: macos-latest
            rid: osx-arm64
            binary: Clickra
            archive: clickra-cli-osx-arm64.tar.gz

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish NativeAOT CLI
        run: |
          dotnet publish src/Clickra.CLI/Clickra.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o publish/out -p:TargetFramework=net8.0 -warnaserror

      - name: Package archive
        shell: bash
        run: |
          cd publish/out
          chmod +x ${{ matrix.binary }}
          tar -czf ../../${{ matrix.archive }} ${{ matrix.binary }}
          cd ../..

      - name: Upload CLI archive artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1

  pack-tool:
    name: Pack .NET Global Tool
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Pack .NET Tool
        run: dotnet pack src/Clickra.CLI/Clickra.csproj -c Release -o publish/nupkg -warnaserror

      - name: Upload .NET Tool package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clickra-nupkg
          path: publish/nupkg/*.nupkg
          if-no-files-found: error
          retention-days: 1

  assemble-msix:
    name: Assemble and sign MSIX
    needs: native-publish
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      is_release: ${{ steps.release-trigger.outputs.is_release }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Generate product icon assets
        shell: pwsh
        run: |
          dotnet run --project scripts/tools/IconGen/IconGen.csproj

      # Single source of truth for release triggers. Downstream publishing jobs
      # consume this output so manual workflow_dispatch runs can validate the
      # package without creating a GitHub Release or shipping to the Store.
      - name: Detect Release Trigger
        id: release-trigger
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "push" && "$REF" == refs/tags/v* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_PUBLISH" == "true" && "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download CLI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clickra-cli
          path: publish/cli

      - name: Download Shell Extension artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clickra-shell
          path: publish/shell

      - name: Download Launcher artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clickra-launcher
          path: publish/launcher

      - name: Assemble Main MSIX
        shell: pwsh
        run: |
          . ./scripts/build_common.ps1
          Add-WindowsSdkToolsToPath

          Remove-ForceDir "$script:LayoutDir"
          New-Item -ItemType Directory -Path "$script:LayoutDir" -Force | Out-Null
          Copy-AssemblyLayout `
            -Root $script:Root `
            -PackagingDir $script:PackagingDir `
            -LayoutDir $script:LayoutDir `
            -PublishDir $script:PublishDir

          $msixPath = New-AndSignMsix `
            -Root $script:Root `
            -PackagingDir $script:PackagingDir `
            -LayoutDir $script:LayoutDir

          if (-not (Test-Path "./Clickra.msix")) {
              throw "Main MSIX was not produced."
          }

      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clickra-msix
          path: Clickra.msix
          if-no-files-found: error
          retention-days: 7

  github-release:
    needs: [assemble-msix, native-publish, cross-cli-publish, pack-tool]
    if: needs.assemble-msix.outputs.is_release == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download Windows CLI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clickra-cli-win-x64.zip
          path: .

      - name: Download Linux CLI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clickra-cli-linux-x64.tar.gz
          path: .

      - name: Download macOS CLI archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clickra-cli-osx-arm64.tar.gz
          path: .

      - name: Download .NET Tool package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clickra-nupkg
          path: publish/nupkg

      - name: Extract English Release Notes
        id: get_release_notes
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) { $env:INPUT_TAG } else { $env:REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+\.\d+$') {
              throw "Invalid release tag format: '$tag'. Expected vX.X.X.X"
          }
          Write-Host "Extracting English release notes for tag: $tag"
          $notes = ""
          $listingPath = "docs/store/StoreListing_EN.md"
          if (Test-Path $listingPath) {
              $content = Get-Content $listingPath -Raw -Encoding utf8
              $pattern = "(?ms)^##\s+What's new in this version\s*\r?\n(.*?)(?=^##\s+|\Z)"
              if ($content -match $pattern) {
                  $notes = $Matches[1].Trim()
                  Write-Host "Found release notes in StoreListing_EN.md"
              }
          }
          if ([string]::IsNullOrWhiteSpace($notes)) {
              $notes = "- Maintenance, performance improvements, and stability fixes."
          }
          $delimiter = [guid]::NewGuid().ToString()
          "release_notes<<$delimiter" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_OUTPUT
          "$delimiter" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          TAG_NAME="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid release tag format '$TAG_NAME'" >&2
            exit 1
          fi
          printf "## What's Changed in %s\n\n" "$TAG_NAME" > release_notes.md
          cat << 'EOF' >> release_notes.md
          ${{ steps.get_release_notes.outputs.release_notes }}

          ---
          ### 📦 Installation & Distribution
          - **Microsoft Store**: Official signed distribution channel for Windows.
          - **GitHub Packages (.NET Global Tool)**:
            ```bash
            dotnet tool install -g Clickra --add-source https://nuget.pkg.github.com/Youchenjiang/index.json
            ```
          - **Standalone NativeAOT Binaries**: Download the archive for your OS from Release Assets (`clickra-cli-linux-x64.tar.gz`, `clickra-cli-osx-arm64.tar.gz`, `clickra-cli-win-x64.zip`).

          GitHub direct-download MSIX publication is disabled until a production code-signing provider is explicitly selected, integrated, and validated. No unsigned or untrusted MSIX asset is published here.
          EOF
          gh release create "$TAG_NAME" \
            --repo "$REPO" \
            --title "$TAG_NAME" \
            --notes-file release_notes.md \
            clickra-cli-linux-x64.tar.gz \
            clickra-cli-osx-arm64.tar.gz \
            clickra-cli-win-x64.zip
      - name: Publish to GitHub Packages (NuGet)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          dotnet nuget push "publish/nupkg/*.nupkg" \
            --source "https://nuget.pkg.github.com/$OWNER/index.json" \
            --api-key "$GH_TOKEN" \
            --skip-duplicate


  store-publish:
    needs: assemble-msix
    if: needs.assemble-msix.outputs.is_release == 'true'
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clickra-msix
          path: .

      - name: Setup Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      - name: Create MSStore Config
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
          STORE_PRODUCT_ID: ${{ secrets.STORE_PRODUCT_ID }}
        run: |
          $config = @{
              TenantId = $env:STORE_TENANT_ID
              ClientId = $env:STORE_CLIENT_ID
              ClientSecret = $env:STORE_CLIENT_SECRET
              SellerId = $env:STORE_SELLER_ID
              ProductId = $env:STORE_PRODUCT_ID
              MsixPath = "Clickra.msix"
          }
          $config | ConvertTo-Json | Out-File -FilePath scripts/local_store_config.json -Encoding utf8

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Publish to Microsoft Store
        run: python scripts/publish_store.py

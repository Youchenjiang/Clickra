name: Release Clickra MSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish Shell DLL
      run: dotnet publish src/ClickraShell/ClickraShell.csproj -c Release -r win-x64 --output ./publish/shell

    - name: Publish CLI App
      run: dotnet publish src/Clickra.CLI/Clickra.csproj -c Release -r win-x64 --output ./publish/cli

    - name: Prepare MSIX Layout
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path ./msix_layout -Force
        New-Item -ItemType Directory -Path ./msix_layout/Assets -Force
        Copy-Item "./publish/cli/Clickra.exe" "./msix_layout/"
        Copy-Item "./publish/shell/ClickraShell.dll" "./msix_layout/"
        Copy-Item "./packaging/msix/AppxManifest.xml" "./msix_layout/"
        Copy-Item "./packaging/msix/Assets/*" "./msix_layout/Assets/" -Recurse
        Copy-Item "./src/resources/app.ico" "./msix_layout/app.ico"
        # Also ensure app.png exists for modern menu
        Copy-Item "./packaging/msix/Assets/StoreLogo.png" "./msix_layout/app.png"

    - name: Find Windows SDK Tools
      id: sdk-tools
      shell: pwsh
      run: |
        $kitPath = "C:\Program Files (x86)\Windows Kits\10\bin"
        $latestVersion = Get-ChildItem -Path $kitPath | Where-Object { $_.Name -match "^10\.0\." } | Sort-Object Name -Descending | Select-Object -First 1
        $sdkBin = Join-Path $kitPath $latestVersion.Name "x64"
        echo "SDK_BIN=$sdkBin" >> $env:GITHUB_ENV
        Write-Host "Found SDK tools at: $sdkBin"

    - name: Create MSIX Package
      shell: pwsh
      run: |
        & "${{ env.SDK_BIN }}\makeappx.exe" pack /d ./msix_layout /p Clickra.msix /o

    - name: Sign MSIX (CI Self-Signed)
      shell: pwsh
      run: |
        # The Subject MUST match the Publisher in AppxManifest.xml
        $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=CBF59877-21AD-4BC4-8F91-FE8DA520A138" -KeyUsage DigitalSignature -FriendlyName "Clickra CI Cert" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
        & "${{ env.SDK_BIN }}\signtool.exe" sign /fd SHA256 /a /sha1 $($cert.Thumbprint) Clickra.msix

    - name: Fetch Merged Pull Request Description
      id: get_pr_desc
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $commitSha = "${{ github.sha }}"
        Write-Host "Fetching PR for commit: $commitSha"
        $prBody = ""
        try {
            $pullsJson = gh api "repos/${{ github.repository }}/commits/$commitSha/pulls"
            $pulls = $pullsJson | ConvertFrom-Json
            if ($pulls -and $pulls.Count -gt 0) {
                $prBody = $pulls[0].body
                Write-Host "Found PR #${($pulls[0].number)}: $($pulls[0].title)"
            }
        } catch {}
        if ([string]::IsNullOrWhiteSpace($prBody)) {
            Write-Host "No direct PR found for commit. Fetching the last merged PR..."
            try {
                $lastPrJson = gh pr list --state merged --limit 1 --json body,number,title
                $lastPr = $lastPrJson | ConvertFrom-Json
                if ($lastPr -and $lastPr.Count -gt 0) {
                    $prBody = $lastPr[0].body
                    Write-Host "Found last merged PR #${($lastPr[0].number)}: $($lastPr[0].title)"
                }
            } catch {}
        }
        if ([string]::IsNullOrWhiteSpace($prBody)) {
            $prBody = "No release notes available."
        }
        $delimiter = [guid]::NewGuid().ToString()
        "pr_body<<$delimiter" >> $env:GITHUB_OUTPUT
        $prBody >> $env:GITHUB_OUTPUT
        "$delimiter" >> $env:GITHUB_OUTPUT

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cat << 'EOF' > release_notes.md
        ${{ steps.get_pr_desc.outputs.pr_body }}

        ---
        ### 📦 Installation
        1. Download the attached `Clickra.msix`.
        2. Double-click to install.

        *Note: This package is signed with a CI certificate for automation.*
        EOF
        
        gh release create "${{ github.ref_name }}" Clickra.msix --title "${{ github.ref_name }}" --notes-file release_notes.md

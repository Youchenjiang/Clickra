name: Release Clickra MSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    # Single source of truth for release triggers. All release-only steps
    # (GitHub Release, Store publish, and any future store-related step)
    # must gate on this flag so manual workflow_dispatch runs can validate
    # the packaging without shipping to production.
    - name: Detect Release Trigger
      id: release-trigger
      shell: bash
      run: |
        # Release-only steps run only on a version-tag push. Requiring
        # event_name == 'push' also excludes manual workflow_dispatch runs
        # that select a v-tag ref, so a human-triggered run can never ship
        # to the store or create a release.
        if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then
          echo "is_release=true" >> "$GITHUB_OUTPUT"
        else
          echo "is_release=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # ---- 雙軌產出 ----
    # Clickra.msix        = Fluent 軌道（WinUI 3，framework-dependent，供 Microsoft Store 與有 .NET 的用戶）
    # Clickra-Native.msix = NativeAOT 軌道（零依賴，供沒有 .NET / Windows App Runtime 的乾淨機器）
    # ClickraSetup.exe    = 自動偵測 runtime 並安裝對應軌道的 bootstrapper

    - name: Build Fluent MSIX (Store track)
      shell: pwsh
      run: |
        ./scripts/build_msix.ps1
        if (-not (Test-Path "./Clickra.msix")) {
            throw "Fluent MSIX was not produced."
        }

    - name: Build NativeAOT MSIX (Zero-dependency track)
      shell: pwsh
      run: |
        ./scripts/build_native_msix.ps1
        if (-not (Test-Path "./Clickra-Native.msix")) {
            throw "NativeAOT MSIX was not produced."
        }

    - name: Build ClickraSetup Bootstrapper
      shell: pwsh
      run: |
        dotnet publish src/Clickra.Setup/Clickra.Setup.csproj -c Release -r win-x64 -o ./publish-setup
        Copy-Item "./publish-setup/ClickraSetup.exe" "./ClickraSetup.exe"
        if (-not (Test-Path "./ClickraSetup.exe")) {
            throw "ClickraSetup.exe was not produced."
        }

    - name: Sign ClickraSetup.exe (CI Self-Signed)
      shell: pwsh
      run: |
        $cert = Get-ChildItem Cert:\CurrentUser\My | Where-Object Subject -like "*CBF59877-21AD-4BC4-8F91-FE8DA520A138*" | Select-Object -First 1
        if ($cert) {
            & signtool.exe sign /fd SHA256 /a /sha1 $cert.Thumbprint ./ClickraSetup.exe
        } else {
            Write-Warning "No matching certificate found; ClickraSetup.exe left unsigned."
        }

    - name: Fetch Merged Pull Request Description
      id: get_pr_desc
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $commitSha = "${{ github.sha }}"
        Write-Host "Fetching PR for commit: $commitSha"
        $prBody = ""
        try {
            $pullsJson = gh api "repos/${{ github.repository }}/commits/$commitSha/pulls"
            $pulls = $pullsJson | ConvertFrom-Json
            if ($pulls -and $pulls.Count -gt 0) {
                $prBody = $pulls[0].body
                Write-Host "Found PR #${($pulls[0].number)}: $($pulls[0].title)"
            }
        } catch {}
        if ([string]::IsNullOrWhiteSpace($prBody)) {
            Write-Host "No direct PR found for commit. Fetching the last merged PR..."
            try {
                $lastPrJson = gh pr list --state merged --limit 1 --json body,number,title
                $lastPr = $lastPrJson | ConvertFrom-Json
                if ($lastPr -and $lastPr.Count -gt 0) {
                    $prBody = $lastPr[0].body
                    Write-Host "Found last merged PR #${($lastPr[0].number)}: $($lastPr[0].title)"
                }
            } catch {}
        }
        if ([string]::IsNullOrWhiteSpace($prBody)) {
            $prBody = "No release notes available."
        }
        $delimiter = [guid]::NewGuid().ToString()
        "pr_body<<$delimiter" >> $env:GITHUB_OUTPUT
        $prBody >> $env:GITHUB_OUTPUT
        "$delimiter" >> $env:GITHUB_OUTPUT

    - name: Create GitHub Release
      if: steps.release-trigger.outputs.is_release == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cat << 'EOF' > release_notes.md
        ${{ steps.get_pr_desc.outputs.pr_body }}

        ---
        ### 📦 Installation
        **自動安裝（推薦）**：下載 `ClickraSetup.exe`，它會自動偵測本機是否具備 .NET 8 與 Windows App Runtime，
        有 → 安裝 Fluent 軌道（`Clickra.msix`）；沒有 → 安裝零依賴的 NativeAOT 軌道（`Clickra-Native.msix`）。

        手動安裝亦可直接下載對應的 MSIX：
        - `Clickra.msix`（Fluent，需要 .NET 8+ 與 Windows App Runtime 2.x）
        - `Clickra-Native.msix`（NativeAOT，零依賴，乾淨機器可用）

        *Note: These packages are signed with a CI certificate for automation.*
        EOF
        gh release create "${{ github.ref_name }}" \
          Clickra.msix Clickra-Native.msix ClickraSetup.exe \
          --title "${{ github.ref_name }}" --notes-file release_notes.md

    - name: Setup Microsoft Store Developer CLI
      uses: microsoft/microsoft-store-apppublisher@b76227f539d68e6465f79bbbc82ed92f61081aa4 # v1.3

    - name: Create MSStore Config
      shell: pwsh
      env:
        STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
        STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
        STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
        STORE_PRODUCT_ID: ${{ secrets.STORE_PRODUCT_ID }}
      run: |
        $config = @{
            TenantId = $env:STORE_TENANT_ID
            ClientId = $env:STORE_CLIENT_ID
            ClientSecret = $env:STORE_CLIENT_SECRET
            SellerId = $env:STORE_SELLER_ID
            ProductId = $env:STORE_PRODUCT_ID
            MsixPath = "Clickra.msix"
        }
        $config | ConvertTo-Json | Out-File -FilePath scripts/local_store_config.json -Encoding utf8


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Publish to Microsoft Store
      # Only publish to the store on a version tag; a manual workflow_dispatch
      # must be able to validate the packaging without shipping to production.
      if: steps.release-trigger.outputs.is_release == 'true'
      run: python scripts/publish_store.py

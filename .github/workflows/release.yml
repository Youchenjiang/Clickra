name: Release Clickra MSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # NativeAOT dominates release build time. Publish independent binaries on
  # separate hosted runners, then fan them in for deterministic MSIX assembly.
  native-publish:
    name: Publish ${{ matrix.name }} (NativeAOT)
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CLI
            project: src/Clickra.CLI/Clickra.csproj
            artifact: clickra-cli
            output: cli
          - name: Shell Extension
            project: src/ClickraShell/ClickraShell.csproj
            artifact: clickra-shell
            output: shell
          - name: Launcher
            project: src/ClickraLauncher/ClickraLauncher.csproj
            artifact: clickra-launcher
            output: launcher

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish ${{ matrix.name }}
        shell: pwsh
        run: |
          . ./scripts/build_common.ps1
          Add-VsInstallerToPath
          dotnet publish "${{ matrix.project }}" -c Release -r win-x64 --self-contained true -o "publish/${{ matrix.output }}" -warnaserror

      - name: Upload ${{ matrix.name }} artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: publish/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 1

  assemble-msix:
    name: Assemble and sign MSIX
    needs: native-publish
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      is_release: ${{ steps.release-trigger.outputs.is_release }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Single source of truth for release triggers. Downstream publishing jobs
      # consume this output so manual workflow_dispatch runs can validate the
      # package without creating a GitHub Release or shipping to the Store.
      - name: Detect Release Trigger
        id: release-trigger
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download CLI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clickra-cli
          path: publish/cli

      - name: Download Shell Extension artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clickra-shell
          path: publish/shell

      - name: Download Launcher artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clickra-launcher
          path: publish/launcher

      - name: Assemble Main MSIX
        shell: pwsh
        run: |
          . ./scripts/build_common.ps1
          Add-WindowsSdkToolsToPath

          Remove-ForceDir "$script:LayoutDir"
          New-Item -ItemType Directory -Path "$script:LayoutDir" -Force | Out-Null
          Copy-AssemblyLayout `
            -Root $script:Root `
            -PackagingDir $script:PackagingDir `
            -LayoutDir $script:LayoutDir `
            -PublishDir $script:PublishDir

          $msixPath = New-AndSignMsix `
            -Root $script:Root `
            -PackagingDir $script:PackagingDir `
            -LayoutDir $script:LayoutDir

          if (-not (Test-Path "./Clickra.msix")) {
              throw "Main MSIX was not produced."
          }

      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clickra-msix
          path: Clickra.msix
          if-no-files-found: error
          retention-days: 7

  github-release:
    needs: assemble-msix
    if: needs.assemble-msix.outputs.is_release == 'true'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract English Release Notes
        id: get_release_notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Write-Host "Extracting English release notes for tag: $tag"
          $notes = ""
          $listingPath = "docs/store/StoreListing_EN.md"
          if (Test-Path $listingPath) {
              $content = Get-Content $listingPath -Raw -Encoding utf8
              $pattern = "(?ms)^##\s+What's new in this version\s*\r?\n(.*?)(?=^##\s+|\Z)"
              if ($content -match $pattern) {
                  $notes = $Matches[1].Trim()
                  Write-Host "Found release notes in StoreListing_EN.md"
              }
          }
          if ([string]::IsNullOrWhiteSpace($notes)) {
              $notes = "- Maintenance, performance improvements, and stability fixes."
          }
          $delimiter = [guid]::NewGuid().ToString()
          "release_notes<<$delimiter" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_OUTPUT
          "$delimiter" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ## What's Changed in ${{ github.ref_name }}

          ${{ steps.get_release_notes.outputs.release_notes }}

          ---
          ### 📦 Installation
          Microsoft Store remains the signed distribution channel for this release.

          GitHub direct-download MSIX publication is disabled until a production code-signing provider is explicitly selected, integrated, and validated. No unsigned or untrusted MSIX asset is published here.
          EOF
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" --notes-file release_notes.md

  store-publish:
    needs: assemble-msix
    if: needs.assemble-msix.outputs.is_release == 'true'
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clickra-msix
          path: .

      - name: Setup Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      - name: Create MSStore Config
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
          STORE_PRODUCT_ID: ${{ secrets.STORE_PRODUCT_ID }}
        run: |
          $config = @{
              TenantId = $env:STORE_TENANT_ID
              ClientId = $env:STORE_CLIENT_ID
              ClientSecret = $env:STORE_CLIENT_SECRET
              SellerId = $env:STORE_SELLER_ID
              ProductId = $env:STORE_PRODUCT_ID
              MsixPath = "Clickra.msix"
          }
          $config | ConvertTo-Json | Out-File -FilePath scripts/local_store_config.json -Encoding utf8

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Publish to Microsoft Store
        run: python scripts/publish_store.py

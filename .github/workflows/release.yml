name: Release Clickra MSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-msix:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      is_release: ${{ steps.release-trigger.outputs.is_release }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Single source of truth for release triggers. Downstream publishing jobs
      # consume this output so manual workflow_dispatch runs can validate the
      # package without creating a GitHub Release or shipping to the Store.
      - name: Detect Release Trigger
        id: release-trigger
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build Main MSIX (NativeAOT)
        shell: pwsh
        run: |
          ./scripts/build_msix.ps1
          if (-not (Test-Path "./Clickra.msix")) {
              throw "Main MSIX was not produced."
          }

      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clickra-msix
          path: Clickra.msix
          if-no-files-found: error
          retention-days: 7

  github-release:
    needs: build-msix
    if: needs.build-msix.outputs.is_release == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Validate Artifact Signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          ARTIFACT_SIGNING_PUBLISHER: ${{ vars.ARTIFACT_SIGNING_PUBLISHER }}
        run: |
          $required = @(
              'AZURE_CLIENT_ID',
              'AZURE_TENANT_ID',
              'AZURE_SUBSCRIPTION_ID',
              'ARTIFACT_SIGNING_ENDPOINT',
              'ARTIFACT_SIGNING_ACCOUNT_NAME',
              'ARTIFACT_SIGNING_CERTIFICATE_PROFILE',
              'ARTIFACT_SIGNING_PUBLISHER'
          )
          $missing = $required | Where-Object {
              [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          }
          if ($missing) {
              throw "Artifact Signing configuration is incomplete. Missing: $($missing -join ', ')"
          }

      - name: Build GitHub direct-download package identity
        shell: pwsh
        env:
          ARTIFACT_SIGNING_PUBLISHER: ${{ vars.ARTIFACT_SIGNING_PUBLISHER }}
        run: |
          ./scripts/build_github_msix.ps1 -Publisher $env:ARTIFACT_SIGNING_PUBLISHER
          if (-not (Test-Path "./Clickra.msix")) {
              throw "GitHub direct-download MSIX was not produced."
          }

      - name: Azure login for Artifact Signing
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign MSIX with Azure Artifact Signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\Clickra.msix
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false

      - name: Verify trusted MSIX signature
        shell: pwsh
        run: ./scripts/verify_msix_signature.ps1 -MsixPath ./Clickra.msix

      - name: Fetch Merged Pull Request Description
        id: get_pr_desc
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $commitSha = "${{ github.sha }}"
          Write-Host "Fetching PR for commit: $commitSha"
          $prBody = ""
          try {
              $pullsJson = gh api "repos/${{ github.repository }}/commits/$commitSha/pulls"
              $pulls = $pullsJson | ConvertFrom-Json
              if ($pulls -and $pulls.Count -gt 0) {
                  $prBody = $pulls[0].body
                  Write-Host "Found PR #${($pulls[0].number)}: $($pulls[0].title)"
              }
          } catch {}
          if ([string]::IsNullOrWhiteSpace($prBody)) {
              Write-Host "No direct PR found for commit. Fetching the last merged PR..."
              try {
                  $lastPrJson = gh pr list --repo "${{ github.repository }}" --state merged --limit 1 --json body,number,title
                  $lastPr = $lastPrJson | ConvertFrom-Json
                  if ($lastPr -and $lastPr.Count -gt 0) {
                      $prBody = $lastPr[0].body
                      Write-Host "Found last merged PR #${($lastPr[0].number)}: $($lastPr[0].title)"
                  }
              } catch {}
          }
          if ([string]::IsNullOrWhiteSpace($prBody)) {
              $prBody = "No release notes available."
          }
          $delimiter = [guid]::NewGuid().ToString()
          "pr_body<<$delimiter" >> $env:GITHUB_OUTPUT
          $prBody >> $env:GITHUB_OUTPUT
          "$delimiter" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ${{ steps.get_pr_desc.outputs.pr_body }}

          ---
          ### 📦 Installation
          **下載安裝**：
          下載 `Clickra.msix`（零依賴 NativeAOT，任何 Windows 10+ 機器可直接安裝）。

          手動安裝亦可直接下載對應的 MSIX：

          - Microsoft Store builds can install the Fluent optional package from Store; GitHub direct-download builds currently use the NativeAOT interface only.

          *Note: GitHub Release assets are published only when the MSIX signature validates as trusted.*
          EOF
          gh release create "${{ github.ref_name }}" \
            Clickra.msix \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" --notes-file release_notes.md

  store-publish:
    needs: build-msix
    if: needs.build-msix.outputs.is_release == 'true'
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clickra-msix
          path: .

      - name: Setup Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      - name: Create MSStore Config
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
          STORE_PRODUCT_ID: ${{ secrets.STORE_PRODUCT_ID }}
        run: |
          $config = @{
              TenantId = $env:STORE_TENANT_ID
              ClientId = $env:STORE_CLIENT_ID
              ClientSecret = $env:STORE_CLIENT_SECRET
              SellerId = $env:STORE_SELLER_ID
              ProductId = $env:STORE_PRODUCT_ID
              MsixPath = "Clickra.msix"
          }
          $config | ConvertTo-Json | Out-File -FilePath scripts/local_store_config.json -Encoding utf8

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Publish to Microsoft Store
        run: python scripts/publish_store.py
